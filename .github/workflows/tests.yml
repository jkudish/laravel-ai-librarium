name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            stability: prefer-lowest
            os: ubuntu-latest
          - php: '8.4'
            stability: prefer-stable
            os: windows-latest
          - php: '8.5'
            stability: prefer-stable
            os: ubuntu-latest
          - php: '8.5'
            stability: prefer-stable
            os: windows-latest

    name: PHP ${{ matrix.php }} / Laravel 13 / ${{ matrix.stability }} / ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest --ci

  clean-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Create a clean Laravel 13 consumer
        run: composer create-project laravel/laravel:^13 consumer --no-interaction --prefer-dist

      - name: Install the package
        working-directory: consumer
        run: |
          composer config repositories.librarium '{"type":"path","url":"..","options":{"symlink":false}}'
          composer require jkudish/laravel-ai-librarium:@dev --no-interaction

      - name: Verify discovery and resolution
        working-directory: consumer
        run: |
          php artisan package:discover --ansi
          php artisan tinker --execute="dump(app(\\Jkudish\\LaravelAiLibrarium\\Contracts\\Librarium::class)::class);"
