name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            stability: prefer-lowest
            os: ubuntu-latest
          - php: '8.4'
            stability: prefer-stable
            os: windows-latest
          - php: '8.5'
            stability: prefer-stable
            os: ubuntu-latest
          - php: '8.5'
            stability: prefer-stable
            os: windows-latest

    name: PHP ${{ matrix.php }} / Laravel 13 / ${{ matrix.stability }} / ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest --ci

  clean-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: fileinfo
          coverage: none

      - name: Create a clean Laravel 13 consumer
        run: composer create-project laravel/laravel:^13 consumer --no-interaction --prefer-dist

      - name: Install the package
        working-directory: consumer
        run: |
          composer config repositories.librarium '{"type":"path","url":"..","options":{"symlink":false}}'
          composer require jkudish/laravel-ai-librarium:@dev --no-interaction

      - name: Verify discovery and resolution
        working-directory: consumer
        run: |
          php artisan package:discover --ansi
          php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (! $app->make(Jkudish\LaravelAiLibrarium\Contracts\Librarium::class) instanceof Jkudish\LaravelAiLibrarium\LibrariumManager) { throw new RuntimeException("Librarium contract binding failed."); } if (! Jkudish\LaravelAiLibrarium\Facades\Librarium::query("smoke test") instanceof Jkudish\LaravelAiLibrarium\PendingResearch) { throw new RuntimeException("Librarium facade query failed."); }'
