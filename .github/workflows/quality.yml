name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run PHPStan and Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=github

      - name: Run architecture tests
        run: vendor/bin/pest tests/ArchTest.php --ci
